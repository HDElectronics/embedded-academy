# The PR title becomes the squash commit on main, so it must be a
# Conventional Commit (see AGENTS.md, "Git workflow").
name: PR title

on:
  # pull_request_target so the check also runs for PRs from forks. This
  # workflow never checks out or runs code from the PR.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            content
            fix
            docs
            refactor
            test
            build
            ci
            chore
            revert
          scopes: |
            site
            anim
            ui
            boards
            labs
            deps
            docs
            repo
            m00
            m01
            m02
            m03
            m04
            m05
            m06
            m07
            m08
            m09
            m10
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}"
            must not start with an uppercase letter. Use the imperative
            mood in lowercase, for example "add memory map timeline".
